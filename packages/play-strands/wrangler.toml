name = "strands"
main = "dist/worker.js"
compatibility_date = "2026-10-15"

# Replace database_id after `npx wrangler d1 create ledring-play-strands`.
# The placeholder is not a real database. Do not deploy until it is replaced.
[[d1_databases]]
binding = "DB"
database_name = "ledring-play-strands"
database_id = "6ae9635c-de35-402a-b876-a7da8e6b0303"

# Workers AI. No API token. Wrangler attaches this binding on deploy.
[ai]
binding = "AI"
